{% for post in include.posts %}
<li class="py-2">
  <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  <span class="post-meta"> | {{ post.date | date: "%Y‑%m‑%d" }}</span>
  {%‑if post.description %}
  <div class="post-excerpt mt-1 mb-2 text-muted small">
    {{ post.description }}
  </div>
  {%‑endif %}
</li>
{% endfor %}
